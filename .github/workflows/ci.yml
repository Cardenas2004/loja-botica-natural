name: CI - Botica Natural Quality & Security Gate

on:
  push:
    branches:
      - main
      - audit-hardening
  pull_request:
    branches:
      - main
      - audit-hardening

jobs:
  verify-and-test:
    name: Verify, Audit & E2E Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run sanitization and integrity contracts
        run: npm test

      - name: Install Playwright browsers and system dependencies
        run: npx playwright install --with-deps

      - name: Run Playwright E2E test suite (Chromium, Firefox, WebKit)
        run: npx playwright test

      - name: Upload Playwright test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
